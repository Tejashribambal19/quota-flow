services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quota_platform
      POSTGRES_USER: quota_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-quota_secret}
    volumes:
      - quota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_user -d quota_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - quota_redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/quota_platform
      DB_USERNAME: quota_user
      DB_PASSWORD: ${DB_PASSWORD:-quota_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  quota_postgres_data:
  quota_redis_data:
